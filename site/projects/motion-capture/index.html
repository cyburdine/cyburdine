<!DOCTYPE html><html lang="en" data-cy-render="off">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self'; connect-src 'self'; frame-src https://www.youtube-nocookie.com;">
  <title>Motion Capture</title>
  <link rel="preload" href="/assets/fonts/IBMPlexSans-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/VT323.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/IBMPlexSansCondensed-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<!--
  THE BOOTH — z0 world / z1 glass. Purely decorative, so aria-hidden and
  pointer-events:none throughout; CSS shows them in clean mode only, which
  keeps the boot cinematic's own CRT chrome untouched.
-->
<div class="cy-world" aria-hidden="true">
  <div class="cy-world__photo"></div>
  <div class="cy-world__grade"></div>
  <canvas class="cy-world__motes"></canvas>
</div>
<div class="cy-glass" aria-hidden="true"></div>

<div class="cy-rail cy-rail--top">
  <span class="cy-rail__id">CYB//NODE</span>
  <span class="cy-rail__cell cy-live">LIVE</span>
  <span class="cy-rail__spacer"></span>
  <span class="cy-rail__cell cy-rail__cell--opt">34.05N 118.24W</span>
  <span class="cy-rail__cell"><span class="cy-clock">--:--:--Z</span></span>
</div>

  <div class="terminal-wrapper">
  <div class="terminal-container">
    <div class="terminal-screen">
	  <canvas id="glitchCanvas"></canvas>
      <header>
  <nav class="glow">
    <a href="/">Home</a>
    <a href="/about">About</a>
  </nav>
</header>

        <main>
          <article>
  <!--
SPDX-FileCopyrightText: © 2025 Justin Burdine <justin@cyburdine.com>
SPDX-License-Identifier: BSD-3-Clause

  Framed page header. Params:
    title   — heading text (required)
    kicker  — small system label above the title (optional)
    type    — meta chip, e.g. "LOG" / "PROJECT" (optional)
    status  — status pill text (optional)
    live    — truthy → cyan "live" pill instead of pink (optional)
    date    — pre-formatted date string (optional)
    tags    — array of tag strings (optional)
-->
<div class="cy-page-header">
  
  <h1>Motion Capture</h1>
  
  <div class="cy-statusbar">
    <span class="cy-meta">PROJECT</span>
    
  </div>
  
  
  <div class="cy-tags">
    <span class="cy-tag">vfx</span><span class="cy-tag">diy</span>
  </div>
  
</div>

  <div class="console cy-frame cy-frame--wip"><!--
SPDX-FileCopyrightText: © 2025 Justin Burdine <justin@cyburdine.com>
SPDX-License-Identifier: BSD-3-Clause
-->
<p>:: INIT // subject: Motion Capture<br />
:: DESC // building a motion capture studio
:: STATUS // in progress // TBD</p>
<p>// full doc coming soon</p>
</div>
</article>

        </main>
	  <footer>
  <p>&copy; <a href="#" class="cy-reboot" aria-label="Reload and replay the intro">1999-2026 cyburdine</a></p>
</footer>
      
    </div>
      <!-- FRAME OVERLAY sits on top -->
    <img src="/assets/images/terminal-full.webp" alt="Terminal Frame" class="terminal-frame" width="3000" height="1688" />
    <!-- Easter eggs: invisible links over the "4" and "D" keys replay the boot -->
    <a href="#" class="cy-egg cy-egg--four" aria-label="Reboot terminal"></a>
    <a href="#" class="cy-egg cy-egg--d" aria-label="Reboot terminal"></a>
  </div>
  </div>
<!-- site javascripts -->
  <!-- boot.js first: sets the pre-paint guard + boot flag before others parse -->
  <script src="/assets/js/boot.js"></script>
  <script src="/assets/js/render.js"></script>
  <script src="/assets/js/video_glitch.js"></script>
  <script src="/assets/js/responsive.js"></script>
  <script src="/assets/js/world.js"></script>

<div class="cy-rail cy-rail--bottom">
  <nav aria-label="Primary">
    <a href="/">Home</a>
    <a href="/about">About</a>
  </nav>
  <span class="cy-ticker" aria-hidden="true"></span>
</div>
</body>
</html>
