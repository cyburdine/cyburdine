<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>plate :: firepype</title>
<!--
  Gallery thumbnail source for /projects/firepype/. Rendered to
  site/assets/images/articles/firepype-thumb.webp by ../build.sh.
  Shared design and the reasoning behind it: ../plate.css.
-->
<link rel="stylesheet" href="/tools/thumbs/plate.css">
<style>
  .plate { --ghost-left: 31%; --ghost-size: 200px; --ghost-alpha: 0.20;
           --ghost-top: 452px; }
  /* A scene plate, like Spirefall, and for the same reason arrived at the
     hard way: the first pass cut the drive out with a clip-path and got a
     featureless slab. The drive reads as a subject in the full frame only
     because the rack around it gives it scale and the shallow depth of
     field points at it; isolated, it is an out-of-focus rectangle with
     nothing in it. The frame keeps its own composition instead, graded
     off the photograph's teal and toward the palette. */
  .plate__scene { position: absolute; inset: 0; z-index: 0; }
  .plate__scene img {
    width: 100%; height: 100%; object-fit: cover;
    object-position: 62% 50%;
    filter: saturate(0.55) hue-rotate(-12deg) contrast(1.06) brightness(0.92);
  }
  .plate__scene::after {
    content: ''; position: absolute; inset: 0;
    background:
      linear-gradient(100deg, rgba(9,15,24,0.28) 0%, rgba(10,17,27,0.58) 44%, rgba(8,13,21,0.90) 100%),
      radial-gradient(96% 80% at 62% 76%, rgba(186,150,98,0.22) 0%, rgba(0,0,0,0) 66%);
  }
  .plate__field { display: none; }
</style>

  <div class="plate__ghost">FIREPYPE</div>

<script src="/tools/thumbs/matte.js"></script>
<script>
  /* build.sh shoots on virtual-time idle, so the only requirement here is
     that nothing settles until the fonts are loaded and every matte has
     been swapped in. */
  Promise.all([document.fonts.ready, CyMatte.run()]).then(function () {
    document.documentElement.setAttribute('data-plate-ready', '1');
  });
</script>
