<style>
  .plate { --ghost-left: 17%; --ghost-size: 178px; --glow-x: 68%; --glow-y: 76%; }
  /* The camera, not the empty studio the tile used to show, and the lens
     it is cut around is the exact thing the LED-ring motif rings.
     The crop is tight to the camera on purpose: wider, the frame includes
     a dark rig plate and a chair leg that are nowhere near the floor's
     colour, so the fill cannot reach them and they survive as debris
     floating on the field. Cropping them out is exact where widening a
     tolerance to swallow them would also swallow the camera.
     `seedEdges: "lr"` rather than a handful of points, because what is
     behind the camera is not one background: pale cloth, bare floor and a
     warm wood wedge sit far enough apart that a fill starting on any one
     of them cannot cross to the others without a tolerance loose enough to
     also enter the camera body. Seeding every pixel down both sides gives
     each region a seed of its own colour and needs no hand-placing.
     Left and right only, never top or bottom: the camera is taller than
     the crop and runs off both, so a seed at top centre lands on the flash
     and fills the camera from the inside — which is precisely what an
     earlier eight-point set did. The sides are the only border the subject
     never touches. */
  .plate__subject { left: 96px; top: 54px; width: 560px; }
  .plate__subject img { filter: brightness(1.14) contrast(1.04); }
</style>
